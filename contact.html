  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="/index.html" class="logo" aria-label="Kayla Marie Collective home">

          <a href="/contact.html" class="btn-nav active" aria-current="page">Start a Project</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <!-- Page Hero -->
      <section class="page-hero">
        <div class="container">
          <h1>Start a Project</h1>
          <p>Tell me what you’re building so we can see if we’re a fit.</p>
        </div>
      </section>

      <!-- Contact Form -->
      <section class="contact-section">
        <div class="container">
          <form
            class="project-form"
            method="POST"
            action="https://formspree.io/f/xdakrvrv"
          >
            <!-- Helpful metadata for Formspree -->
            <input type="hidden" name="_subject" value="New Project Inquiry — Kayla Marie Collective" />

            <!-- Honeypot (spam protection). Hide via CSS if you want. -->
            <label style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;">
              Do not fill this out
              <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
            </label>

            <label>
              Name *
              <input type="text" name="name" required autocomplete="name" />
            </label>

            <label>
              Business / Brand Name
              <input type="text" name="brand" autocomplete="organization" />
            </label>

            <label>
              Email *
              <input type="email" name="email" required autocomplete="email" />
            </label>

            <label>
              What do you want built? *
              <textarea
                name="project_details"
                rows="4"
                placeholder="Website, journal, bundle, or something else?"
                required
              ></textarea>
            </label>

            <label>
              Budget Range (USD) *
              <select name="budget" required>
                <option value="">Select one</option>
                <option value="1000-1500">$1,000 – $1,500</option>
                <option value="1500-3000">$1,500 – $3,000</option>
                <option value="3000-5000">$3,000 – $5,000</option>
                <option value="5000+">$5,000+</option>
              </select>
            </label>

            <label>
              Ideal Timeline *
              <input
                type="text"
                name="timeline"
                placeholder="For example: March launch, or ASAP"
                required
                autocomplete="off"
              />
            </label>

            <label>
              Links to existing brand / socials
              <textarea
                name="links"
                rows="2"
                placeholder="Instagram, website, TikTok, etc."
              ></textarea>
            </label>

            <button type="submit" class="btn-primary">Submit Inquiry</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">

        <a href="mailto:kaylamariecollective@gmail.com" class="footer-link">
          kaylamariecollective@gmail.com
        </a>
      </div>
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();
      </script>
    </footer>
